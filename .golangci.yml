version: "2"

run:
  timeout: 5m
  exclude-dirs:
    - cmd/gopca-desktop/frontend
    - cmd/gocsv/frontend

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

issues:
  exclude-patterns:
    - path: cmd/gopca-desktop/main.go
      text: "pattern all:frontend/dist"
    - path: cmd/gocsv/main.go
      text: "pattern all:frontend/dist"