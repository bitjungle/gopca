name: Build and Test

# Workflow triggers are optimized to prevent duplicate runs:
# - Push events: Direct pushes to main and develop branches
# - Pull requests: All PRs targeting main or develop branches
# - This prevents double runs when pushing to a feature branch with an open PR
on:
  push:
    branches: [ main, develop ]  # Run on pushes to main and develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ main, develop ]  # Run on PRs to main and develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:  # Allow manual triggering

env:
  GO_VERSION: '1.24'

# Restrict all jobs to read-only repository access by default.
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # Continue running other jobs even if one fails
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Configure Git line endings
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    
    - name: Download Go dependencies
      run: go mod download

    - name: Verify go.mod is tidy
      run: |
        go mod tidy
        git diff --exit-code -- go.mod go.sum
    
    - name: Set up Python for validation
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        
    - name: Cache Python dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('testdata/validation/*.py') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Generate sklearn validation references
      run: |
        cd testdata
        python -m venv .venv
        
        # Activate virtual environment based on OS
        if [ "$RUNNER_OS" == "Windows" ]; then
          source .venv/Scripts/activate
        else
          source .venv/bin/activate
        fi
        
        # Install required packages
        python -m pip install --upgrade pip
        pip install numpy pandas scikit-learn
        
        # Generate reference results
        cd validation
        echo "Generating PCA reference results..."
        python generate_reference_pca.py
        
        echo "Generating Kernel PCA reference results..."
        python generate_kernel_pca_reference.py
        
        # Only generate temporal PCA on non-Windows (issues with some dependencies)
        if [ "$RUNNER_OS" != "Windows" ]; then
          echo "Generating Temporal PCA reference results..."
          python generate_temporal_pca_reference.py
        fi
        
        # List generated files for verification
        echo "Generated reference files:"
        ls -la reference_results/*.json | head -10
      shell: bash
    
    - name: Run tests
      run: |
        if [ "$RUNNER_OS" == "Windows" ]; then
          # Create minimal frontend/dist directories for Wails apps (avoids embed errors)
          mkdir -p cmd/gopca-desktop/frontend/dist
          echo '<!DOCTYPE html><html><body>Test</body></html>' > cmd/gopca-desktop/frontend/dist/index.html
          mkdir -p cmd/gocsv/frontend/dist
          echo '<!DOCTYPE html><html><body>Test</body></html>' > cmd/gocsv/frontend/dist/index.html
          
          # Run tests for all packages with test files
          # Note: Use explicit list to avoid Windows issues with packages without tests
          # Skip TestValidateOutputPath on Windows as it uses Unix-specific paths
          go test -v -race -timeout 10m ./internal/cli ./internal/core ./pkg/types ./cmd/gopca-desktop
          
          # Run sklearn validation tests if reference files exist
          if [ -d "testdata/validation/reference_results" ]; then
            echo "Running sklearn validation tests..."
            go test -v -timeout 10m ./internal/core -run "TestValidate|TestNIPALS|TestMath"
          fi
          go test -v -race -timeout 10m -skip "TestValidateOutputPath" ./internal/utils
          # Test GoCSV commands separately (skip app tests that require Wails context)
          cd cmd/gocsv && go test -v -race -timeout 10m -run "TestMultiStepUndoRedo|TestUndoRedoState" . && cd ../..
        else
          make ci-test
        fi
      shell: bash
      env:
        GOPCA_TEST_TIMEOUT: 10m
    
    - name: Run linter
      run: |
        echo "Checking code formatting..."
        
        # Use gofmt -l to list files that need formatting
        NEED_FORMAT=""
        for dir in internal pkg cmd/gopca-cli; do
          if [ -d "$dir" ]; then
            output=$(gofmt -l "$dir" 2>/dev/null || true)
            if [ -n "$output" ]; then
              NEED_FORMAT="${NEED_FORMAT}${output}\n"
            fi
          fi
        done
        
        if [ -n "$NEED_FORMAT" ]; then
          echo "ERROR: The following files need formatting:"
          echo -e "$NEED_FORMAT"
          echo ""
          echo "Run 'go fmt ./...' locally to fix formatting."
          exit 1
        else
          echo "✓ All files are properly formatted"
        fi
        
        echo ""
        echo "Running go vet..."
        go vet ./internal/... ./pkg/...
        
        echo ""
        echo "Checking for inefficient assignments..."
        if command -v ineffassign &> /dev/null; then
          ineffassign ./...
        else
          echo "ineffassign not found, skipping"
        fi
      shell: bash
    
    - name: Build pca CLI for integration tests
      run: |
        echo "Building CLI for integration tests..."
        make build
      shell: bash
    
    - name: Run integration tests
      run: |
        echo "Running integration tests..."
        make test-e2e
      shell: bash
      env:
        GOPCA_TEST_TIMEOUT: 60

  build-cli:
    name: Build pca CLI
    needs: test
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push' || github.ref == 'refs/heads/160-macos-signing'
    runs-on: self-hosted
    # Fallback: runs-on: ubuntu-latest  # Use if self-hosted runner unavailable
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Configure Git line endings
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    
    - name: Build all platforms
      run: make ci-build-cli
    
    - name: Upload pca CLI artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pca-binaries
        path: build/pca-*
        retention-days: 7

  build-desktop:
    name: Build GoPCA Desktop
    needs: test
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push' || github.ref == 'refs/heads/160-macos-signing'
    strategy:
      fail-fast: false  # Continue building other platforms even if one fails
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: darwin
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Configure Git line endings
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: package-lock.json
    
    - name: Install Wails
      run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
    
    - name: Install Linux dependencies
      if: matrix.os == 'ubuntu-latest'
      run: ./scripts/ci/install-linux-deps.sh
    
    - name: Install all dependencies (monorepo)
      run: |
        # Install from root to get all workspace dependencies
        npm ci
    
    - name: Build shared UI components
      run: |
        # Build the shared components that both apps depend on
        npm run build-ui
    
    - name: Build GoPCA Desktop
      run: PLATFORM=${{ matrix.platform }} ./scripts/ci/build-desktop.sh
      shell: bash
    
    - name: Sign GoPCA Desktop (macOS)
      if: matrix.os == 'macos-latest'
      env:
        APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
      run: |
        ./scripts/ci/sign-macos-ci.sh cmd/gopca-desktop/build/bin/GoPCA.app
      shell: bash
    
    - name: Notarize GoPCA Desktop (macOS)
      if: matrix.os == 'macos-latest'
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        ./scripts/ci/notarize-macos-ci.sh cmd/gopca-desktop/build/bin/GoPCA.app
      shell: bash
    
    - name: Upload GoPCA artifacts
      uses: actions/upload-artifact@v4
      with:
        name: gopca-desktop-${{ matrix.platform }}
        path: |
          cmd/gopca-desktop/build/bin/*
          !cmd/gopca-desktop/build/bin/*.pdb
          !cmd/gopca-desktop/build/bin/*.ilk
        retention-days: 7

  build-gocsv:
    name: Build GoCSV Desktop
    needs: test
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push' || github.ref == 'refs/heads/160-macos-signing'
    strategy:
      fail-fast: false  # Continue building other platforms even if one fails
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: darwin
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Configure Git line endings
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: package-lock.json
    
    - name: Install Wails
      run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
    
    - name: Install Linux dependencies
      if: matrix.os == 'ubuntu-latest'
      run: ./scripts/ci/install-linux-deps.sh
    
    - name: Install all dependencies (monorepo)
      run: |
        # Install from root to get all workspace dependencies
        npm ci
    
    - name: Build shared UI components
      run: |
        # Build the shared components that both apps depend on
        npm run build-ui
    
    - name: Build GoCSV Desktop
      run: PLATFORM=${{ matrix.platform }} APPNAME=gocsv ./scripts/ci/build-gocsv.sh
      shell: bash
    
    - name: Sign GoCSV Desktop (macOS)
      if: matrix.os == 'macos-latest'
      env:
        APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
      run: |
        ./scripts/ci/sign-macos-ci.sh cmd/gocsv/build/bin/GoCSV.app
      shell: bash
    
    - name: Notarize GoCSV Desktop (macOS)
      if: matrix.os == 'macos-latest'
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        ./scripts/ci/notarize-macos-ci.sh cmd/gocsv/build/bin/GoCSV.app
      shell: bash
    
    - name: Package macOS GoCSV app for artifact upload
      if: matrix.os == 'macos-latest'
      run: |
        cd cmd/gocsv/build/bin
        # Use tar to preserve symlinks and attributes
        tar -czf GoCSV.app.tar.gz GoCSV.app
        cd -
      shell: bash
    
    - name: Upload GoCSV Desktop artifacts
      uses: actions/upload-artifact@v4
      with:
        name: gocsv-${{ matrix.platform }}
        path: |
          cmd/gocsv/build/bin/*
          !cmd/gocsv/build/bin/*.pdb
          !cmd/gocsv/build/bin/*.ilk
          !cmd/gocsv/build/bin/GoCSV.app
        retention-days: 7
    
    - name: Upload macOS GoCSV Desktop bundle
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: gocsv-${{ matrix.platform }}-app
        path: cmd/gocsv/build/bin/GoCSV.app.tar.gz
        retention-days: 7