name: Privacy Audit

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run weekly on Sundays at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  privacy-audit:
    name: Privacy and Telemetry Audit
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        go mod download
        npm ci
    
    - name: Run privacy verification script
      run: |
        chmod +x scripts/verify-privacy.sh
        ./scripts/verify-privacy.sh
    
    - name: Check for telemetry in Go dependencies
      run: |
        echo "Checking Go dependencies for telemetry..."
        if go list -m all | grep -iE "telemetry|analytics|tracking|sentry|datadog|newrelic"; then
          echo "::error::Found potential telemetry-related Go dependencies"
          exit 1
        fi
        echo "✅ No telemetry Go dependencies found"
    
    - name: Check for telemetry in npm dependencies
      run: |
        echo "Checking npm dependencies for telemetry..."
        if npm ls 2>/dev/null | grep -iE "analytics|telemetry|tracking|gtag|google-analytics|sentry|datadog|mixpanel"; then
          echo "::error::Found potential telemetry-related npm dependencies"
          exit 1
        fi
        echo "✅ No telemetry npm dependencies found"
    
    - name: Scan for external URLs in source
      run: |
        echo "Scanning for external URLs..."
        URLS=$(grep -r "https://" \
          --include="*.go" \
          --include="*.ts" \
          --include="*.tsx" \
          --exclude-dir="vendor" \
          --exclude-dir="node_modules" \
          --exclude-dir="dist" \
          --exclude-dir="build" \
          . | \
          grep -vE "github\.com|json-schema\.org|doi\.org|arxiv\.org|npmjs\.com|wails\.io/docs|localhost|127\.0\.0\.1" || true)
        
        if [ -n "$URLS" ]; then
          echo "::warning::Found external URLs that need review:"
          echo "$URLS"
        else
          echo "✅ No concerning external URLs found"
        fi
    
    - name: Check for network code in Go
      run: |
        echo "Checking for network code..."
        if grep -r "http\.\(Get\|Post\|Client\)" --include="*.go" --exclude-dir="vendor" .; then
          echo "::error::Found HTTP client usage in Go code"
          exit 1
        fi
        echo "✅ No HTTP client usage found"
    
    - name: Check for fetch/XHR in frontend
      run: |
        echo "Checking for fetch/XHR in frontend..."
        if grep -r "fetch\|XMLHttpRequest\|axios" \
          --include="*.ts" \
          --include="*.tsx" \
          --exclude-dir="node_modules" \
          --exclude-dir="dist" \
          . | grep -v "//\|/\*"; then
          echo "::warning::Found potential network calls in frontend"
        else
          echo "✅ No network calls in frontend"
        fi
    
    - name: Verify privacy documentation exists
      run: |
        if [ ! -f "PRIVACY.md" ]; then
          echo "::error::PRIVACY.md file is missing"
          exit 1
        fi
        echo "✅ Privacy documentation exists"
    
    - name: Check binary for telemetry strings
      run: |
        # Build minimal binary for testing
        echo "Building pca CLI for analysis..."
        make build || true
        
        if [ -f "build/pca" ]; then
          echo "Checking binary for telemetry strings..."
          if strings build/pca | grep -iE "telemetry|analytics|beacon|tracking" | grep -v "gopca\|github"; then
            echo "::warning::Found potential telemetry strings in binary"
          else
            echo "✅ No telemetry strings in binary"
          fi
        fi
    
    - name: Generate privacy report
      if: always()
      run: |
        echo "# Privacy Audit Report" > privacy-audit-report.md
        echo "Generated: $(date)" >> privacy-audit-report.md
        echo "" >> privacy-audit-report.md
        echo "## Summary" >> privacy-audit-report.md
        echo "- Go dependencies: ✅ Clean" >> privacy-audit-report.md
        echo "- npm dependencies: ✅ Clean" >> privacy-audit-report.md
        echo "- External URLs: ✅ None concerning" >> privacy-audit-report.md
        echo "- Network code: ✅ None found" >> privacy-audit-report.md
        echo "- Privacy docs: ✅ Present" >> privacy-audit-report.md
    
    - name: Upload privacy report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: privacy-audit-report
        path: privacy-audit-report.md
    
    - name: Comment on PR
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      uses: actions/github-script@v7
      continue-on-error: true
      with:
        script: |
          try {
            const output = `## 🔒 Privacy Audit Results
            
            ✅ **Privacy audit passed** - No telemetry or data collection found
            
            | Check | Status |
            |-------|--------|
            | Go Dependencies | ✅ Clean |
            | npm Dependencies | ✅ Clean |
            | External URLs | ✅ None |
            | Network Code | ✅ None |
            | Privacy Docs | ✅ Present |
            
            View full report in workflow artifacts.`;
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });
          } catch (error) {
            console.log('Could not create comment:', error.message);
            console.log('This is expected for PRs from forks or when permissions are limited.');
          }